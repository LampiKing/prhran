name: PrHran Auto Scraper

on:
  schedule:
    # Ponedeljek in Četrtek ob 02:00 CET (01:00 UTC)
    - cron: '0 1 * * 1'  # Ponedeljek
    - cron: '0 1 * * 4'  # Četrtek
  workflow_dispatch:  # Ročno proženje

jobs:
  scrape-all-stores:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 uri max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install Python dependencies
        run: |
          cd scraper
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Full Scrape with Product Matching
        env:
          CI: true
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          PRHRAN_INGEST_TOKEN: ${{ secrets.PRHRAN_INGEST_TOKEN }}
        run: |
          cd scraper
          python full_scrape_with_matching.py

      - name: Upload scraped data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-products-${{ github.run_id }}
          path: scraper/output/
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "## PrHran Scraping Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scraping completed at $(date)" >> $GITHUB_STEP_SUMMARY
          if [ -f scraper/output/master_products.json ]; then
            TOTAL=$(python -c "import json; print(len(json.load(open('scraper/output/master_products.json'))))")
            echo "Total products: $TOTAL" >> $GITHUB_STEP_SUMMARY
          fi
